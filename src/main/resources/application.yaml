server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/incident_db?options=-c%20timezone=Asia/Kolkata
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        options:
          model: qwen2.5:0.5b
          temperature: 0.3

      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true

app:
  pagination:
    default-page: 0
    default-size: 10
    default-sort-by: createdAt
    default-sort-dir: desc
